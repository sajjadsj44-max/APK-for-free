name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Unpack project.zip (if uploaded from a phone)
        run: |
          if [ -f project.zip ]; then
            unzip -o -q project.zip -d .
            echo "Unpacked project.zip"
          fi
          test -f settings.gradle.kts || { echo "::error::Project files not found. Upload project.zip or the project folder."; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get whisper.cpp (speech-to-text engine)
        run: git clone --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whisper.cpp

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Transcripts-${{ github.run_number }}.apk"
          ls -la out

      - name: Keep the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: Transcripts-APK-${{ github.run_number }}
          path: out/*.apk

      - name: Publish to Releases (easy phone download)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Transcripts build ${{ github.run_number }}
          body: Download the .apk below on your phone and install it.
          files: out/*.apk
          make_latest: true
